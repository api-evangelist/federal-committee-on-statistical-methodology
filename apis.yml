aid: federal-committee-on-statistical-methodology
name: Federal Committee on Statistical Methodology
description: >-
  The Federal Committee on Statistical Methodology (FCSM) is an interagency
  committee, chartered by the Office of Management and Budget and supported by
  the OMB Statistical Policy Office, dedicated to improving the quality of U.S.
  Federal statistics. FCSM publishes methodology guidance, standards and
  conference proceedings — including A Framework for Data Quality — and convenes
  subcommittees and an annual research and policy conference. It is a policy and
  methodology body, not a data publisher: it does not operate or document a
  public developer API, and the statistical data itself is published by its
  member agencies under their own domains.
